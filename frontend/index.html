<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"

<style>
/* ── DARK THEME ── */
[data-theme="dark"] {
  --bg: #0c0c10; --bg2: #111116; --surface: #16161d; --surface2: #1c1c26;
  --border: #222230; --border2: #2a2a3a; --border-live: #2a3a24;
  --text: #ededf5; --text2: #9494b0; --text3: #b4b4c8; --chip-off: #3a3a4c;
  --accent: #5ecb3e; --accent-dim: rgba(94,203,62,0.14); --accent-hl: rgba(94,203,62,0.18); --on-accent: #0c0c10;
  --late: #f5b445; --late-dim: rgba(245,165,36,0.14);
  --early: #7fb2f8; --early-dim: rgba(91,156,246,0.14);
  --blue: #5b9cf6; --blue-dim: rgba(91,156,246,0.14);
  --red: #f05a6a;
  --banner-bg: #ededf5; --banner-fg: #0c0c10; --banner-border: #9494b0;
  --skeleton: #1c1c26;
}
/* ── LIGHT THEME ── */
[data-theme="light"] {
  --bg: #f7f5f0; --bg2: #f0ede6; --surface: #ffffff; --surface2: #f7f5f0;
  --border: #e4dfd5; --border2: #d8d2c8; --border-live: #b9d9ac;
  --text: #1a1814; --text2: #6b6459; --text3: #5a544b; --chip-off: #d8d2c8;
  --accent: #23780c; --accent-dim: rgba(35,120,12,0.10); --accent-hl: rgba(35,120,12,0.16); --on-accent: #ffffff;
  --late: #b45309; --late-dim: rgba(180,83,9,0.10);
  --early: #2563eb; --early-dim: rgba(37,99,235,0.10);
  --blue: #2563eb; --blue-dim: rgba(37,99,235,0.10);
  --red: #c42645;
  --banner-bg: #1a1814; --banner-fg: #f7f5f0; --banner-border: #6b6459;
  --skeleton: #efeae0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100dvh; -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.mono { font-family: 'IBM Plex Mono', monospace; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

.app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }

/* ── OFFLINE BANNER ── */
.offline { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--banner-bg); color: var(--banner-fg); font-size: 13px; font-weight: 600; position: sticky; top: 0; z-index: 900; }
.offline span { flex: 1; }
.offline button { min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--banner-border); background: transparent; color: var(--banner-fg); font-weight: 600; font-size: 13px; }

/* ── HEADER ── */
.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.brand span { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn.ghost { border: 0; background: transparent; color: var(--text); text-decoration: none; }
.icon-btn.ghost.on { color: var(--accent); }
.sun-icon { display: none; } [data-theme="light"] .sun-icon { display: block; } [data-theme="light"] .moon-icon { display: none; }

/* ── SEARCH FIELD ── */
.search-row { padding: 6px 20px 12px; }
.field { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px 0 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border2); }
.field:focus-within { border-color: var(--accent); }
.field input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: none; font-size: 16px; font-weight: 500; }
.field input::placeholder { color: var(--text2); }
.field input::-webkit-search-cancel-button { display: none; }
.field svg.lead { color: var(--text2); flex-shrink: 0; }
.gps { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.gps.busy svg { animation: pulse 1s ease-in-out infinite; }
.clear { width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.clear span { width: 32px; height: 32px; border-radius: 50%; background: var(--border2); color: var(--text); display: flex; align-items: center; justify-content: center; }
@keyframes pulse { 50% { opacity: 0.35; } }

/* ── MAP ── */
.map-card { margin: 0 20px; height: 150px; border-radius: 18px; border: 1px solid var(--border); background: var(--bg2); position: relative; overflow: hidden; transition: height 0.25s ease; }
.map-card.tall { height: 380px; }
#map { position: absolute; inset: 0; background: var(--bg2); }
[data-theme="dark"] #map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }
.map-expand { position: absolute; right: 10px; bottom: 10px; z-index: 500; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-weight: 600; font-size: 13px; }
.leaflet-container { font-family: 'DM Sans', system-ui, sans-serif; }
.leaflet-control-attribution { font-size: 10px; }
.pin { padding: 3px 7px; border-radius: 8px; background: var(--text); color: var(--bg); font: 700 11px 'IBM Plex Mono', monospace; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.35); white-space: nowrap; }
.pin.first { background: var(--accent); color: var(--on-accent); }
.me-dot { width: 22px; height: 22px; border-radius: 50%; background: rgba(91,156,246,0.25); display: flex; align-items: center; justify-content: center; }
.me-dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #5b9cf6; border: 2px solid #ededf5; }

/* ── SECTION HEAD ── */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 20px 8px; }
.sec-head h2 { font-size: 15px; font-weight: 700; flex-shrink: 0; }
.sec-head .meta { font-size: 13px; color: var(--text2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list { display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }

/* ── STOP CARD (nearby) ── */
.stop-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
.stop-card.first { border-color: var(--border-live); }
.stop-card:hover { border-color: var(--border2); }
.stop-row { display: flex; align-items: center; gap: 10px; }
.num { width: 26px; height: 26px; border-radius: 8px; background: var(--text); color: var(--bg); font: 700 13px 'IBM Plex Mono', monospace; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.num.first { background: var(--accent); color: var(--on-accent); }
.grow { flex: 1; min-width: 0; }
.title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 12px; color: var(--text2); }
.chev { color: var(--text2); flex-shrink: 0; }
.chips { display: flex; gap: 8px; }
.chip { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 12px; background: var(--surface2); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.chip .r { font: 600 13px 'IBM Plex Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .m { font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip .m.soon { color: var(--accent); }
.quiet { font-size: 13px; color: var(--text2); }

/* ── STOP VIEW ── */
.bar { display: flex; align-items: center; gap: 4px; padding: 18px 12px 6px; }
.stop-head { padding: 0 20px 14px; }
.stop-head .code { font: 600 12px 'IBM Plex Mono', monospace; color: var(--text2); }
.stop-head h1 { margin: 4px 0 10px; font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; }
.fresh { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text2); flex-shrink: 0; }
.dot.live { background: var(--accent); }
.arr { padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
.arr.live { border-color: var(--border-live); }
.arr-top { display: flex; align-items: center; gap: 10px; }
.route-badge { min-width: 48px; height: 32px; padding: 0 8px; border-radius: 9px; background: var(--text); color: var(--bg); font: 700 14px 'IBM Plex Mono', monospace; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.route-badge.sm { min-width: 44px; height: 30px; padding: 0 6px; border-radius: 8px; font-size: 13px; }
.arr .dest { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big { font-size: 30px; font-weight: 700; line-height: 1; white-space: nowrap; text-align: right; }
.big small { font-size: 14px; font-weight: 600; }
.big.live { color: var(--accent); }
.big.sched { color: var(--text3); }
.arr-bot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.badge.live { background: var(--accent-dim); color: var(--accent); }
.badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.sched { border: 1px solid var(--chip-off); color: var(--text3); }
.badge.late { background: var(--late-dim); color: var(--late); }
.badge.early { background: var(--early-dim); color: var(--early); }
.then { margin-left: auto; font-size: 12px; color: var(--text2); white-space: nowrap; }
.more { min-height: 48px; border-radius: 14px; border: 1px dashed var(--border2); background: transparent; color: var(--text2); font-weight: 600; font-size: 14px; }
.legend { margin: 12px 20px 8px; padding: 12px 14px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text2); line-height: 1.4; }
.legend svg { flex-shrink: 0; }

/* ── STATES ── */
.panel { margin: 14px 20px 0; padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; }
.panel.dashed { border-style: dashed; border-color: var(--border2); align-items: center; text-align: center; gap: 8px; }
.panel .ptitle { font-size: 16px; font-weight: 700; }
.panel.dashed .ptitle { font-size: 15px; }
.panel .psub { font-size: 13px; color: var(--text2); line-height: 1.45; }
.night-head { display: flex; align-items: center; gap: 12px; }
.night-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--skeleton); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.first-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.first-grid > div { padding: 12px; border-radius: 12px; background: var(--surface2); }
.first-grid .r { font: 700 13px 'IBM Plex Mono', monospace; }
.first-grid .t { font-size: 20px; font-weight: 700; }
.btn { margin-top: 6px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; }
.btn.out { background: var(--surface); color: var(--text); border: 1px solid var(--border2); }
.skel { display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
.skel div { height: 64px; border-radius: 16px; background: var(--skeleton); animation: pulse 1.4s ease-in-out infinite; }
.skel div:nth-child(2) { opacity: 0.6; } .skel div:nth-child(3) { opacity: 0.35; }

/* ── SEARCH VIEW ── */
.search-bar { display: flex; align-items: center; gap: 8px; padding: 18px 12px 12px; }
.search-bar .field { flex: 1; }
.filters { display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto; }
.filters button { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--border2); background: transparent; color: var(--text); font-weight: 600; font-size: 13px; white-space: nowrap; }
.filters button[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.results { display: flex; flex-direction: column; gap: 6px; padding: 0 20px; }
.group-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text2); padding: 10px 0 4px; }
.group-label:first-child { padding-top: 4px; }
.res { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 4px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: 100%; }
.res:hover { background: var(--surface); }
.res-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.res-ico.place { background: var(--blue-dim); color: var(--blue); }
mark { background: var(--accent-hl); color: inherit; border-radius: 4px; padding: 0 2px; }
.recent { padding: 12px 20px 22px; border-top: 1px solid var(--border); margin-top: 16px; }
.recent-list { display: flex; gap: 8px; flex-wrap: wrap; }
.recent-list button { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--border2); background: var(--surface); font-weight: 500; font-size: 13px; }

/* ── VEHICLES / SAVED ── */
.page-title { padding: 18px 20px 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.page-sub { padding: 0 20px 12px; font-size: 13px; color: var(--text2); }
.row-card { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }

/* ── NAV ── */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 800; background: var(--bg); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
nav.tabs a { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 16px; color: var(--text2); font-size: 12px; font-weight: 600; min-height: 56px; }
nav.tabs a[aria-current="page"] { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

// ══════════ STORAGE (always try/catch) ══════════
function load(key, fallback) {

}
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignore */ } }

// ══════════ STATE ══════════
const S = {

  nearby: null,           // [{stop, eta}]

// ══════════ HELPERS ══════════
function esc(str) {
  return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
const ACRONYMS = new Set(["LRT", "MRT", "KTM", "KL", "KLCC", "BRT", "UTC", "PPR", "SK", "SMK", "SJK", "PJ", "USJ", "TTDI", "HKL", "AEON", "IKEA", "UM", "UKM", "UIA", "MRR2", "KLIA", "TNB", "LRT3", "MBSA", "PKNS", "IOI", "KLSentral", "MSU", "UiTM", "DBKL", "JKR", "PDRM", "RTM", "TBS", "II", "III"]);

    const core = w.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    if (!core) return w;
    if (ACRONYMS.has(core) || /\d/.test(core)) return w.toUpperCase();
    return w.toLowerCase().replace(/(^|[(\-/])([a-z])/g, (m, p, c) => p + c.toUpperCase());
  }).join("");
}
function splitStopName(raw) {

  const m = s.match(/^([A-Z]{1,4}\d+)\s+(.*)$/);

}
function stopDisplay(id) {

}
function rememberStop(stop) {

}
function walkMin(m) { return Math.max(1, Math.ceil(m / 80)); }
function fmtDist(m) { return m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${Math.round(m)} m`; }

}
function stopDistance(id) {

  return haversine(S.loc.lat, S.loc.lon, m.lat, m.lon);
}
const clockFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
function clock(iso) { return iso ? clockFmt.format(new Date(iso)) : "—"; }
function minutesOf(item) {

}
// ≤0 → "Now"; 1–59 → "N min"; ≥60 → clock time in KL
function fmtArrival(item) {

  if (m == null) return "—";

  return clock(item.predicted_arrival_time);
}
function klMinutesOfDay(d = new Date()) {

}
function isLive(item) { return item.prediction_source && item.prediction_source !== "schedule"; }

}
function ago(ts) {

}
function highlight(text, q) {

  if (i < 0) return esc(t);

function $(sel, root = document) { return root.querySelector(sel); }

// Upcoming items (drops arrivals already in the past relative to generation time)
function upcoming(data) {

  return (data?.items || []).filter(it => !it.predicted_arrival_time || new Date(it.predicted_arrival_time) >= gen - 60000)
    .sort((a, b) => (minutesOf(a) ?? 1e9) - (minutesOf(b) ?? 1e9));
}
// Group by route_short_name + headsign

    const key = routeLabel(it) + "|" + (it.headsign || "");

    map.get(key).push(it);

}

function isNight(items) {

}

  if (m > 1 && m <= 30) return `<span class="badge late">+${m} min late</span>`;

  return t || (data?.generated_at ? Date.parse(data.generated_at) : 0);
}

// ══════════ NETWORK ══════════
class HttpError extends Error { constructor(status) { super(`HTTP ${status}`); this.status = status; } }
async function apiFetch(path, signal) {

  } catch (err) {
    if (err.name !== "AbortError") setOffline(true);
    throw err;
  }
  if (res.status >= 500) { setOffline(true); throw new HttpError(res.status); }
  setOffline(false);
  S.lastOkAt = Date.now();
  if (!res.ok) throw new HttpError(res.status);
  return res.json();
}
async function fetchEtas(stopId) {
  try { return await apiFetch(`/v1/stops/${encodeURIComponent(stopId)}/etas`); }
  catch (err) { if (err.status === 404) return { stop_id: stopId, items: [], generated_at: new Date().toISOString() }; throw err; }
}
function setOffline(on) {

}
function updateOfflineText() {

$("#retry-btn").addEventListener("click", () => refreshView(true));
window.addEventListener("online", () => refreshView(true));

// ══════════ THEME ══════════
function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); }
function toggleTheme() {

}
try { applyTheme(localStorage.getItem("kb-theme") || "dark"); } catch { applyTheme("dark"); }

// ══════════ LOCATION ══════════
function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("unavailable")); return; }
    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000, maximumAge: 20000 });
  });
}
async function useGPS() {
  S.locError = null;
  $(".gps")?.classList.add("busy");
  if (S.view === "home" && !S.nearby) renderHomeBody({ loading: true });
  try {
    const pos = await getLocation();
    S.loc = { lat: pos.coords.latitude, lon: pos.coords.longitude, label: "Your location", gps: true };
  } catch (err) {
    const isDenied = err?.code === 1, isTimeout = err?.code === 3;
    S.locError = isDenied
      ? "Enable location access in your browser and tap the location button again."
      : isTimeout ? "Location request timed out. Try again."
      : "Location unavailable. Try again or search manually.";
  }
  $(".gps")?.classList.remove("busy");
  S.nearby = null;
  if (S.view === "home") loadNearby(); else location.hash = "#/";
}
function setPlace(lat, lon, label) {
  S.loc = { lat, lon, label, gps: false };
  S.locError = null;
  S.nearby = null;
  if (location.hash === "#/" || location.hash === "") loadNearby(); else location.hash = "#/";
}

// ══════════ ROUTER ══════════
const view = $("#view");
function parseHash() {
  const h = location.hash.replace(/^#/, "") || "/";
  const parts = h.split("/").filter(Boolean).map(decodeURIComponent);
  if (parts[0] === "stop" && parts[1]) return { name: "stop", id: parts[1] };
  if (parts[0] === "route" && parts[1]) return { name: "route", id: parts[1] };
  if (parts[0] === "search") return { name: "search", q: parts[1] || "" };
  if (parts[0] === "saved") return { name: "saved" };
  if (parts[0] === "routes") return { name: "routes" };
  return { name: "home" };
}
let currentRoute = null;
function route() {
  currentRoute = parseHash();
  S.view = currentRoute.name;
  const tab = { home: "nearby", stop: "nearby", search: "nearby", saved: "saved", routes: "routes", route: "routes" }[S.view];
  document.querySelectorAll("nav.tabs a").forEach(a => a.dataset.tab === tab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  destroyMap();
  window.scrollTo(0, 0);
  ({ home: renderHome, stop: renderStop, search: renderSearch, saved: renderSaved, routes: renderRoutes, route: renderRoute })[S.view](currentRoute);
}
window.addEventListener("hashchange", route);
function refreshView(force) {
  if (!force && document.visibilityState !== "visible") return;
  S.lastLoadAt = Date.now();
  if (S.view === "home") { if (S.loc) loadNearby(true); else if (force) useGPS(); }
  else if (S.view === "stop") loadStop(currentRoute.id, true);
  else if (S.view === "saved") loadSaved();
  else if (S.view === "route") loadRoute(currentRoute.id);
}
// 1 s tick: freshness labels + auto-refresh every 30 s while visible
setInterval(() => {
  document.querySelectorAll("[data-ago]").forEach(el => { el.textContent = ago(Number(el.dataset.ago)); });
  updateOfflineText();
  if (document.visibilityState === "visible" && ["home", "stop", "saved", "route"].includes(S.view)
      && S.lastLoadAt && Date.now() - S.lastLoadAt >= REFRESH_SECS * 1000) refreshView();
}, 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.lastLoadAt && Date.now() - S.lastLoadAt >= REFRESH_SECS * 1000) refreshView();
});

// ══════════ HOME ══════════

function renderHomeBody(opts = {}) {

    body.innerHTML = `<div class="sec-head"><h2>Nearby stops</h2><span class="meta">Finding stops…</span></div>
      <div class="skel" aria-label="Loading nearby stops" role="status"><div></div><div></div><div></div></div>`;
    return;
  }
  if (S.locError && !S.loc) {
    body.innerHTML = `<div class="panel dashed">${I.place.replace('width="18" height="18"', 'width="28" height="28"')}
      <div class="ptitle">Location error</div><div class="psub">${esc(S.locError)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button type="button" class="btn out" onclick="useGPS()">Try again</button>

}
function nearbyCard({ stop, eta }, i) {
  const { code, name } = splitStopName(stop.name);
  const dist = stop.distance_m != null ? ` · ${fmtDist(stop.distance_m)} · ${walkMin(stop.distance_m)} min walk` : "";
  const items = eta ? upcoming(eta) : [];
  const perRoute = firstBusPerRoute(items).slice(0, 3);
  let bottom;
  if (eta === null) bottom = `<div class="quiet">Arrivals unavailable</div>`;
  else if (perRoute.length === 0) bottom = `<div class="quiet">No upcoming buses</div>`;
  else bottom = `<div class="chips">${perRoute.map(it => {
    const m = minutesOf(it);
    return `<div class="chip"><span class="r">${esc(routeLabel(it))}</span><span class="m${m != null && m <= 5 ? " soon" : ""}">${esc(fmtArrival(it))}</span></div>`;
  }).join("")}</div>`;
  return `<a class="stop-card${i === 0 ? " first" : ""}" href="#/stop/${encodeURIComponent(stop.stop_id)}">
    <div class="stop-row">
      <span class="num${i === 0 ? " first" : ""}" aria-hidden="true">${i + 1}</span>
      <div class="grow"><div class="title">${esc(name)}</div><div class="sub">${esc(code || stop.stop_id)}${esc(dist)}</div></div>

let nearbySeq = 0;

  let stops;
  try {
    stops = await apiFetch(`/v1/stops/nearby?lat=${S.loc.lat}&lon=${S.loc.lon}&radius_m=${NEARBY_RADIUS_M}&limit=${NEARBY_LIMIT}`);
  } catch {
    if (seq === nearbySeq && S.view === "home") renderHomeBody();
    return;
  }
  stops.forEach(rememberStop);
  const etas = await Promise.all(stops.map(s => fetchEtas(s.stop_id).catch(() => null)));
  if (seq !== nearbySeq) return;
  S.nearby = stops.map((stop, i) => ({ stop, eta: etas[i] }));

}

// ══════════ MAP ══════════
let map = null;
function destroyMap() { if (map) { map.remove(); map = null; } }
function whenLeaflet(cb) {

}

    S.nearby.forEach(({ stop }, i) => {

// ══════════ STOP VIEW ══════════

  if (stopState.data) renderStopBody(); else loadStop(id);
}
async function loadStop(id, silent) {
  S.lastLoadAt = Date.now();
  if (!silent || !stopState.data) $("#stop-body") && ($("#stop-body").innerHTML = `<div class="skel" role="status" aria-label="Loading arrivals"><div></div><div></div><div></div></div>`);
  try {
    const data = await fetchEtas(id);
    if (stopState.id !== id) return;
    stopState.data = data; stopState.at = Date.now();
  } catch { /* keep last data; banner shows offline */ }
  if (S.view === "stop" && currentRoute.id === id) renderStopBody();
}
function renderStopBody() {
  const body = $("#stop-body"), fresh = $("#fresh");
  if (!body) return;
  const data = stopState.data;
  if (!data) {
    fresh.innerHTML = "";
    body.innerHTML = `<div class="panel dashed"><div class="ptitle">Can't load arrivals</div><div class="psub">Check your connection and retry.</div><button type="button" class="btn" onclick="refreshView(true)">Retry</button></div>`;
    return;
  }
  const items = upcoming(data);
  const anyLive = items.some(isLive);
  const ts = newestTimestamp(data) || stopState.at;
  fresh.innerHTML = `<span class="dot${anyLive ? " live" : ""}"></span><span>${anyLive ? "Live" : "Timetable"} · updated <span data-ago="${ts}">${ago(ts)}</span></span>`;

  if (isNight(items)) {
    const firsts = firstBusPerRoute(items).slice(0, 6);
    body.innerHTML = `<div class="panel">
      <div class="night-head"><span class="night-icon">${I.moon}</span>
        <div><div class="ptitle">Buses have stopped for tonight</div><div class="psub">Service resumes in the morning</div></div></div>
      ${firsts.length ? `<div class="first-grid">${firsts.map(it => `<div><div class="r">${esc(routeLabel(it))}</div><div class="psub">First bus</div><div class="t">${esc(clock(it.predicted_arrival_time))}</div></div>`).join("")}</div>` : ""}
    </div>` + legend();
    return;
  }
  if (items.length === 0) {
    body.innerHTML = `<div class="panel dashed">${I.empty}<div class="ptitle">No upcoming buses</div><div class="psub">No arrivals are scheduled at this stop right now.</div></div>`;
    return;
  }
  const groups = groupArrivals(items);
  const LIMIT = 4;
  const shown = stopState.showAll ? groups : groups.slice(0, LIMIT);
  const hidden = groups.length - shown.length;
  body.innerHTML = `<div class="list">${shown.map(arrivalCard).join("")}
    ${hidden > 0 ? `<button type="button" class="more" onclick="stopState.showAll=true;renderStopBody()">Show ${hidden} more route${hidden === 1 ? "" : "s"}</button>` : ""}
  </div>` + legend();
}
function legend() {
  return `<div class="legend">${I.info}<span>LIVE = GPS from the bus. SCHEDULED = timetable only; may change.</span></div>`;
}
function arrivalCard(group) {
  const first = group[0];
  const live = isLive(first);
  const m = minutesOf(first);
  const dest = first.headsign ? `to ${titleCase(first.headsign)}` : (first.route_long_name ? titleCase(first.route_long_name.replace(/\s*~\s*/g, " ↔ ")) : "");
  let big;
  if (m == null) big = "—";
  else if (m <= 0) big = "Now";
  else if (m < 60) big = `${m}<small> min</small>`;
  else big = esc(clock(first.predicted_arrival_time));
  const sub = live ? "" : `Scheduled ${clock(first.scheduled_arrival_time || first.predicted_arrival_time)}`;
  const rest = group.slice(1, 3);
  let then = "";
  if (rest.length) {
    const allMin = rest.every(it => { const x = minutesOf(it); return x != null && x > 0 && x < 60; });
    then = allMin ? `then ${rest.map(minutesOf).join(" · ")} min` : `then ${rest.map(fmtArrival).join(" · ")}`;
  }
  return `<div class="arr${live ? " live" : ""}">
    <div class="arr-top">
      <span class="route-badge">${esc(routeLabel(first))}</span>
      <div class="grow"><div class="dest">${esc(dest)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>
      <div class="big ${live ? "live" : "sched"}">${big}</div>
    </div>
    <div class="arr-bot">
      ${live ? '<span class="badge live">LIVE</span>' : '<span class="badge sched">SCHEDULED</span>'}
      ${live ? delayBadge(first) : ""}
      ${then ? `<span class="then">${esc(then)}</span>` : (live ? "" : '<span class="sub">no live bus yet</span>')}
    </div>
  </div>`;
}

// ══════════ SEARCH ══════════
const searchState = { q: "", stops: [], routes: [], places: [], filter: "all", ctrl: { api: null, places: null }, timers: {}, lastNominatimAt: 0, loading: false };
function renderSearch({ q }) {
  view.innerHTML = `
    <div class="search-bar">
      <button type="button" class="icon-btn ghost" aria-label="Back" onclick="goBack()">${I.back}</button>
      <label for="sq" class="sr-only">Search stops, routes or places</label>
      <div class="field">
        ${I.search}
        <input id="sq" type="search" placeholder="Stop, route no. or place" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="clear" id="sq-clear" aria-label="Clear search" hidden>${I.x}</button>
      </div>
    </div>
    <div class="filters" role="tablist" aria-label="Filter results" id="filters"></div>
    <div class="results" id="results" aria-live="polite"></div>
    <div class="recent" id="recent"></div>`;
  const input = $("#sq");
  input.value = q || searchState.q || "";
  input.focus();
  try { input.setSelectionRange(input.value.length, input.value.length); } catch { /* ignore */ }
  input.addEventListener("input", () => onQuery(input.value));
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); pickTop(); } });
  $("#sq-clear").addEventListener("click", () => { input.value = ""; onQuery(""); input.focus(); });
  onQuery(input.value, true);
}
function onQuery(raw, immediate) {
  const q = raw.trim();
  $("#sq-clear").hidden = !raw;
  history.replaceState(null, "", "#/search" + (raw ? "/" + encodeURIComponent(raw) : ""));
  if (q !== searchState.q) { searchState.stops = []; searchState.routes = []; searchState.places = []; }
  searchState.q = q;
  clearTimeout(searchState.timers.api); clearTimeout(searchState.timers.places);
  searchState.ctrl.api?.abort(); searchState.ctrl.places?.abort();
  if (q.length < 2) { renderResults(); return; }
  searchState.loading = true;
  renderResults();
  searchState.timers.api = setTimeout(() => searchApi(q), immediate ? 0 : 250);
  // Nominatim: never for stop codes / route numbers; debounce 400 ms; ≤1 req/s
  if (q.length >= 3 && !CODE_LIKE.test(q)) {
    const wait = Math.max(immediate ? 0 : 400, 1000 - (Date.now() - searchState.lastNominatimAt));
    searchState.timers.places = setTimeout(() => searchPlaces(q), wait);
  }
}
async function searchApi(q) {
  const ctrl = new AbortController(); searchState.ctrl.api = ctrl;
  const params = new URLSearchParams({ q, limit: "8" });
  if (S.loc) { params.set("lat", S.loc.lat); params.set("lon", S.loc.lon); }
  try {
    const res = await apiFetch(`/v1/search?${params}`, ctrl.signal);
    if (q !== searchState.q) return;
    searchState.stops = res.stops || []; searchState.routes = res.routes || [];
    searchState.stops.forEach(s => rememberStop({ ...s, raw_name: (s.code ? s.code + " " : "") + s.name }));
    searchState.routes.forEach(r => { S.routeMeta[r.route_id] = r; });
  } catch (err) { if (err.name === "AbortError") return; }
  searchState.loading = false;
  if (S.view === "search") renderResults();
}
async function searchPlaces(q) {
  const ctrl = new AbortController(); searchState.ctrl.places = ctrl;
  searchState.lastNominatimAt = Date.now();
  const params = new URLSearchParams({ q, format: "jsonv2", countrycodes: "my", limit: "5", viewbox: "101.40,3.35,101.90,2.85", bounded: "0", "accept-language": "en" });
  try {
    const res = await fetch(`${NOMINATIM}?${params}`, { signal: ctrl.signal });
    const data = await res.json();
    if (q !== searchState.q) return;
    searchState.places = (data || []).map(p => {
      const parts = String(p.display_name || "").split(",").map(s => s.trim());
      return { name: p.name || parts[0], detail: parts.slice(p.name ? 1 : 1, 3).join(", "), lat: parseFloat(p.lat), lon: parseFloat(p.lon) };
    });
  } catch { return; }
  if (S.view === "search") renderResults();
}
function resultList() {
  const f = searchState.filter;
  const out = [];
  if (f === "all" || f === "stops") searchState.stops.forEach(s => out.push({ kind: "stop", s }));
  if (f === "all" || f === "routes") searchState.routes.forEach(r => out.push({ kind: "route", r }));
  if (f === "all" || f === "places") searchState.places.forEach(p => out.push({ kind: "place", p }));
  return out;
}
function renderResults() {
  const q = searchState.q;
  const filters = $("#filters"), results = $("#results"), recent = $("#recent");
  if (!filters) return;
  const counts = { stops: searchState.stops.length, routes: searchState.routes.length, places: searchState.places.length };
  if (q.length < 2) {
    filters.innerHTML = "";
    results.innerHTML = `<p class="quiet" style="padding:4px 4px 0">Search by stop name or code (e.g. <span class="mono">KL105</span>), route number (e.g. <span class="mono">190</span>) or a place.</p>`;
  } else {
    filters.innerHTML = [["all", "All"], ["stops", `Stops ${counts.stops}`], ["routes", `Routes ${counts.routes}`], ["places", `Places ${counts.places}`]]
      .map(([k, l]) => `<button type="button" role="tab" aria-selected="${searchState.filter === k}" data-f="${k}">${esc(l)}</button>`).join("");
    filters.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { searchState.filter = b.dataset.f; renderResults(); }));
    const list = resultList();
    let html = "", last = null;
    for (const r of list) {
      if (r.kind !== last) { html += `<div class="group-label">${{ stop: "Stops", route: "Routes", place: "Places" }[r.kind]}</div>`; last = r.kind; }
      html += resultRow(r, q);
    }
    results.innerHTML = html || `<p class="quiet" style="padding:4px">${searchState.loading ? "Searching…" : `No matches for “${esc(q)}”.`}</p>`;
    results.querySelectorAll("[data-i]").forEach((el, i) => { el.dataset.i = i; el.addEventListener("click", e => { e.preventDefault(); pick(list[i]); }); });
  }
  recent.hidden = S.recent.length === 0;
  recent.innerHTML = `<div class="group-label" style="padding-top:0">Recent</div><div class="recent-list">${S.recent.map((r, i) =>
    `<button type="button" data-r="${i}"${r.kind === "stop" || r.kind === "route" ? ' class="mono"' : ""}>${esc(r.label)}</button>`).join("")}</div>`;
  recent.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => openRecent(S.recent[Number(b.dataset.r)])));
}
function resultRow(r, q) {
  if (r.kind === "stop") {
    const s = r.s; const name = titleCase(s.name);
    const meta = [`<span class="mono">${highlight(s.code || s.stop_id, q)}</span>`, s.routes?.length ? esc(s.routes.slice(0, 4).join(", ")) : null, s.distance_m != null ? esc(fmtDist(s.distance_m)) : null].filter(Boolean).join(" · ");
    return `<a class="res" href="#/stop/${encodeURIComponent(s.stop_id)}" data-i>
      <span class="res-ico">${I.stop}</span><div class="grow"><div class="title">${highlight(name, q)}</div><div class="sub">${meta}</div></div></a>`;
  }
  if (r.kind === "route") {
    const x = r.r;
    return `<a class="res" href="#/route/${encodeURIComponent(x.route_id)}" data-i>
      <span class="route-badge sm">${esc(x.short_name || x.route_id)}</span><div class="grow"><div class="title">${highlight(titleCase((x.long_name || "").replace(/\s*~\s*/g, " ↔ ")), q)}</div>
      <div class="sub">${esc(x.feed_name || "")}</div></div></a>`;
  }
  const p = r.p;
  return `<button type="button" class="res" data-i>
    <span class="res-ico place">${I.place}</span><div class="grow"><div class="title">${highlight(p.name, q)}</div><div class="sub">${esc(p.detail)}</div></div></button>`;
}
function pickTop() { const list = resultList(); if (list.length) pick(list[0]); }
function addRecent(entry) {
  S.recent = [entry, ...S.recent.filter(r => !(r.kind === entry.kind && r.label === entry.label))].slice(0, 6);
  save("kb-recent", S.recent);
}
function pick(r) {
  if (!r) return;
  if (r.kind === "stop") {
    addRecent({ kind: "stop", label: r.s.code || titleCase(r.s.name), id: r.s.stop_id });
    location.hash = "#/stop/" + encodeURIComponent(r.s.stop_id);
  } else if (r.kind === "route") {
    addRecent({ kind: "route", label: r.r.short_name || r.r.route_id, id: r.r.route_id, long_name: r.r.long_name });
    location.hash = "#/route/" + encodeURIComponent(r.r.route_id);
  } else {
    addRecent({ kind: "place", label: r.p.name, lat: r.p.lat, lon: r.p.lon });
    setPlace(r.p.lat, r.p.lon, r.p.name);
  }
}
function openRecent(r) {
  if (r.kind === "stop") location.hash = "#/stop/" + encodeURIComponent(r.id);
  else if (r.kind === "route") { S.routeMeta[r.id] = S.routeMeta[r.id] || { route_id: r.id, short_name: r.label, long_name: r.long_name }; location.hash = "#/route/" + encodeURIComponent(r.id); }
  else setPlace(r.lat, r.lon, r.label);
}

// ══════════ SAVED ══════════
const savedState = { etas: {} };
function renderSaved() {
  view.innerHTML = `<h1 class="page-title">Saved stops</h1><p class="page-sub">Tap the star on a stop to keep it here.</p><div class="list" id="saved-list"></div>`;
  drawSaved();
  if (S.saved.length) loadSaved();
}
async function loadSaved() {
  S.lastLoadAt = Date.now();
  const results = await Promise.all(S.saved.map(id => fetchEtas(id).catch(() => savedState.etas[id] ?? null)));
  S.saved.forEach((id, i) => { savedState.etas[id] = results[i]; });
  if (S.view === "saved") drawSaved();
}
function drawSaved() {
  const list = $("#saved-list");
  if (!list) return;
  if (!S.saved.length) {
    list.innerHTML = `<div class="panel dashed" style="margin:0">${I.star(false)}<div class="ptitle">No saved stops yet</div>
      <div class="psub">Open a stop and tap the star to save it.</div><a class="btn" href="#/" style="display:inline-flex;align-items:center;text-decoration:none">Find nearby stops</a></div>`;
    return;
  }
  list.innerHTML = S.saved.map(id => {
    const { code, name } = stopDisplay(id);
    const eta = savedState.etas[id];
    let next = `<span class="quiet">…</span>`;
    if (eta === null) next = `<span class="quiet">unavailable</span>`;
    else if (eta) {
      const first = upcoming(eta)[0];
      next = first ? `<span class="route-badge sm">${esc(routeLabel(first))}</span><span class="chip" style="flex:none;background:none;padding:0"><span class="m${isLive(first) ? " soon" : ""}">${esc(fmtArrival(first))}</span></span>` : `<span class="quiet">No buses</span>`;
    }
    return `<a class="row-card" href="#/stop/${encodeURIComponent(id)}"><div class="grow"><div class="title">${esc(name)}</div><div class="sub mono">${esc(code || id)}</div></div>${next}${I.chev}</a>`;
  }).join("");
}

// ══════════ ROUTES ══════════
function renderRoutes() {
  const routes = S.recent.filter(r => r.kind === "route");
  view.innerHTML = `<h1 class="page-title">Routes</h1><p class="page-sub">See where a route's buses are right now.</p>
    <div class="search-row"><a class="field" href="#/search" style="text-decoration:none;color:var(--text2)">${I.search}<span>Search a route number, e.g. <span class="mono">190</span></span></a></div>
    ${routes.length ? `<div class="sec-head"><h2>Recently viewed</h2></div><div class="list">${routes.map(r => `<a class="row-card" href="#/route/${encodeURIComponent(r.id)}">
      <span class="route-badge sm">${esc(r.label)}</span><div class="grow"><div class="title">${esc(titleCase((r.long_name || "").replace(/\s*~\s*/g, " ↔ ")))}</div></div>${I.chev}</a>`).join("")}</div>` : ""}`;
}
const routeState = { id: null, vehicles: null, at: 0 };
function renderRoute({ id }) {
  const meta = S.routeMeta[id] || {};
  if (routeState.id !== id) { routeState.id = id; routeState.vehicles = null; }
  view.innerHTML = `
    <div class="bar"><button type="button" class="icon-btn ghost" aria-label="Back" onclick="goBack()">${I.back}</button><div style="flex:1"></div>
      <button type="button" class="icon-btn ghost" aria-label="Refresh vehicles" onclick="refreshView(true)">${I.refresh}</button></div>
    <div class="stop-head"><div class="code">Route ${esc(meta.short_name || id)}</div>
      <h1>${esc(meta.long_name ? titleCase(meta.long_name.replace(/\s*~\s*/g, " ↔ ")) : `Route ${meta.short_name || id}`)}</h1>
      <div class="fresh" id="route-fresh"></div></div>
    <div id="route-body"></div>`;
  if (routeState.vehicles) drawRoute(); else loadRoute(id);
}
async function loadRoute(id) {
  S.lastLoadAt = Date.now();
  if (!routeState.vehicles && $("#route-body")) $("#route-body").innerHTML = `<div class="skel" role="status" aria-label="Loading vehicles"><div></div><div></div></div>`;
  try {
    const v = await apiFetch(`/v1/routes/${encodeURIComponent(id)}/vehicles`);
    if (routeState.id !== id) return;
    routeState.vehicles = v; routeState.at = Date.now();
  } catch { /* keep last data */ }
  if (S.view === "route" && currentRoute.id === id) drawRoute();
}
function drawRoute() {
  const body = $("#route-body");
  if (!body) return;
  const v = routeState.vehicles;
  if (!v) { body.innerHTML = `<div class="panel dashed"><div class="ptitle">Can't load vehicles</div><button type="button" class="btn" onclick="refreshView(true)">Retry</button></div>`; return; }
  $("#route-fresh").innerHTML = `<span class="dot${v.length ? " live" : ""}"></span><span>${v.length} bus${v.length === 1 ? "" : "es"} live · updated <span data-ago="${routeState.at}">${ago(routeState.at)}</span></span>`;
  if (!v.length) { body.innerHTML = `<div class="panel dashed">${I.empty}<div class="ptitle">No live buses on this route</div><div class="psub">Buses may not be running right now, or aren't reporting GPS.</div></div>`; return; }
  body.innerHTML = `<div class="list">${v.map(x => {
    const seen = Date.parse(x.observed_at);
    const stop = x.stop_id ? stopDisplay(x.stop_id) : null;
    return `<div class="row-card"><span class="res-ico">${I.logo.replace('width="28" height="28"', 'width="18" height="18"').replace('stroke="var(--accent)"', 'stroke="currentColor"')}</span>
      <div class="grow"><div class="title mono">${esc(x.vehicle_id)}</div>
      <div class="sub">Seen <span data-ago="${seen}">${ago(seen)}</span>${stop ? ` · near <a href="#/stop/${encodeURIComponent(x.stop_id)}">${esc(stop.name)}</a>` : ""}</div></div></div>`;
  }).join("")}</div>`;
}

// ══════════ BOOT ══════════
route();
</script>
