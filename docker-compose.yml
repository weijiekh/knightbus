services:
  db:
    restart: "no"
    image: postgres:16
    environment:
      POSTGRES_DB: knightbus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    restart: "no"
    build: .
    env_file:
      - .env
    command: uvicorn knightbus.main:app --host 0.0.0.0 --port 56709
    depends_on:
      - db
    ports:
      - "56709:56709"

  worker:
    restart: "no"
    build: .
    env_file:
      - .env
    command: python -m knightbus.scheduler
    depends_on:
      - db

  web:
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
