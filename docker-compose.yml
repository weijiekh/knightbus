name: knightbus

services:
  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: knightbus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${KNIGHTBUS_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knightbus"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    restart: unless-stopped
    build: .
    env_file:
      - .env
    command: uvicorn knightbus.main:app --host 0.0.0.0 --port 56709
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KNIGHTBUS_API_PORT:-56709}:56709"
    volumes:
      - ./artifacts:/app/artifacts

  worker:
    restart: unless-stopped
    build: .
    env_file:
      - .env
    command: python -m knightbus.scheduler
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts

  web:
    profiles: ["web"]
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
