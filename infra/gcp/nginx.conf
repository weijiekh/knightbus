# Knightbus: API-only reverse proxy to the uvicorn container on 127.0.0.1:8100.
#
# The SPA is served from Cloudflare Pages; its /v1/* Pages Function forwards
# here. SERVER_NAME_PLACEHOLDER is the VM's sslip.io hostname, e.g.
# knightbus.34.1.2.3.sslip.io, which resolves to the IP with no DNS setup.
# This is a subdomain because the bare <ip>.sslip.io host belongs to caruma.
#
# Run certbot AFTER this is in place:
#           sudo certbot --nginx -d "$DOMAIN"
# Certbot rewrites this file to add the 443 server block and the 80->443
# redirect. Re-copying this file later will undo that: re-run certbot if you do.

upstream knightbus_api {
    server 127.0.0.1:8100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_PLACEHOLDER;

    access_log /var/log/nginx/knightbus.access.log;
    error_log  /var/log/nginx/knightbus.error.log;

    # FastAPI routes carry the /v1 prefix, so it is passed through unchanged.
    location /v1/ {
        proxy_pass http://knightbus_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location / {
        return 404;
    }
}
